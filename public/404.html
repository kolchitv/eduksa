<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <title>منصة لغتي التعليمية - جاري توجيهك للصفحة...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Single Page Application (SPA) Deep Link Redirect Handler
      (function() {
        var path = window.location.pathname;
        var search = window.location.search;
        var hash = window.location.hash;
        
        // Store full redirect URL for index.html to pick up
        try {
          sessionStorage.setItem('lughati_spa_redirect', window.location.href);
        } catch (e) {}

        // Redirect immediately to root with query fallback
        var target = '/?p=' + encodeURIComponent(path + search + hash);
        window.location.replace(target);
      })();
    </script>
    <style>
      body {
        margin: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #064e3b;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(255, 255, 255, 0.2);
        border-top-color: #34d399;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 20px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div class="spinner"></div>
    <h2 style="font-size: 1.25rem; font-weight: bold; margin-bottom: 8px;">جاري توجيهك للصفحة المطلوبة...</h2>
    <p style="font-size: 0.9rem; color: #a7f3d0; margin: 0;">منصة لغتي التعليمية • المنهاج السعودي 🇸🇦</p>
  </body>
</html>
