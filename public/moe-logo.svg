    <circle cx="234" cy="22" r="8.2" fill="#008480" />
    <circle cx="240" cy="38" r="8.2" fill="#008C88" />
    <circle cx="246" cy="55" r="8.2" fill="#009590" />

    <circle cx="250" cy="12" r="9" fill="#008C87" />
