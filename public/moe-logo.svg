  <!-- Official Arabic Typography: وزارة التعليم -->
  <g id="moe-arabic-text">
    <text
      x="160"
      y="158"
      text-anchor="middle"
      font-family="'Alexandria', 'Tajawal', 'Segoe UI', 'Arial', sans-serif"
      font-weight="900"
      font-size="34"
      letter-spacing="1px"
      fill="#006C67"
    >
      وزارة الـتـعـلـيـم
    </text>
  </g>

  <!-- English Subtitle: Ministry of Education -->
  <g id="moe-english-text">
    <text
      x="160"
      y="190"
      text-anchor="middle"
      font-family="'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', sans-serif"
      font-weight="500"
      font-size="16.5"
      letter-spacing="0.8px"
      fill="#636E72"
    >
      Ministry of Education
    </text>
  </g>
</svg>
